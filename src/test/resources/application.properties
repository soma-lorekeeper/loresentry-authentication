spring.flyway.enabled=true
# 테스트에서는 outbox relay 를 끈다. 뒤에서 돌면 테스트가 넣은 outbox 행을 먼저 가져가 버리고,
# Kafka 가 없는 테스트에서는 계정을 지울 때마다 발행에 실패한다.
# relay 자체를 확인하는 OutboxRelayEnabledTest 만 이 값을 켠다.
kafka.producer.relay.enabled=false
# 테스트에는 EDOT Java agent가 없다. agent의 Kafka 발행 계측처럼 보내는 순간의 지금 문맥으로 traceparent 헤더를 넣는다
# (support/AgentLikeTracing). 운영과 같이 outbox 행의 범위 안에서 보내야 헤더가 원래 요청의 trace를 잇는다.
spring.kafka.producer.properties.interceptor.classes=com.loresentry.authentication.support.AgentLikeTracing$TraceparentInjector
