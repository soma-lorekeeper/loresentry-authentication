spring:
  application:
    name: authentication
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authentication}
    username: ${DB_USERNAME:authentication_svc}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 2000
      initialization-fail-timeout: -1
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${KAFKA_CLIENT_ID:authentication}
    admin:
      # topic 은 gitops 의 KafkaTopic 선언이 만든다. 앱이 기동하며 topic 을 만들거나 고치지 않는다.
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 모든 in-sync replica 가 받아야 성공으로 친다. outbox 의 발행 표시는 이 응답을 받은 뒤에만 한다.
      acks: all
      properties:
        # 같은 producer 세션 안에서 재시도로 생기는 중복과 순서 뒤바뀜을 broker 가 막는다.
        enable.idempotence: true
        # send() 가 broker 정보나 버퍼의 빈자리를 기다리는 최대 시간. broker 에 닿지 못하면 여기서 실패한다.
        max.block.ms: 5000
        # 요청 하나를 보내고 broker 의 응답을 기다리는 최대 시간. 넘으면 다시 보낸다.
        request.timeout.ms: 10000
        # send() 가 돌아온 뒤 성공이나 실패가 확정되기까지의 최대 시간(재시도 포함).
        # OutboxPublisher 가 결과를 기다리는 25초보다 짧아야 한다.
        delivery.timeout.ms: 20000

server:
  port: 8000
  shutdown: graceful

# 로그: 모든 줄을 ECS JSON 한 줄로 stdout에 쓴다(docs LOG_SCHEMA.md 5절). Logstash가 이 줄을 필드로 펼친다.
logging:
  structured:
    format:
      # Boot 내장 ecs 형식 대신 우리 formatter. log.origin.function·error.type 같은 필드를 이름 충돌 없이 함께 낸다
      console: com.loresentry.authentication.adapter.out.logging.EcsLogFormatter
    ecs:
      service:
        # Kubernetes 이름(LOG_SCHEMA.md 6절). spring.application.name(authentication)과 다르다
        name: authentication-api
        # 이미지 태그(build-<run>-<attempt>). CI가 docker build --build-arg로 넘기고 Dockerfile이 ENV로 둔다
        version: ${APP_VERSION:unknown}

# trace: W3C traceparent로 span을 잇는다(LOG_SCHEMA.md 7절).
management:
  tracing:
    sampling:
      # dev는 모든 요청을 기록한다. prod 비율은 prod 실측 후 overlay 환경 변수로 정한다
      probability: 1.0
    propagation:
      # W3C 헤더만 읽고 쓴다. B3 등 다른 형식은 받지 않는다
      consume: w3c
      produce: w3c
    baggage:
      # baggage 헤더는 쓰지 않는다
      enabled: false
    export:
      # 전체는 켜 둔다. Boot 4는 W3C 전파기(traceparent 읽기·쓰기)도 이 값에 묶어 두어, 끄면 전파기가 noop이 되어
      # 받은 traceparent를 잇지 못한다
      enabled: true
      otlp:
        # span 전송(OTLP)만 끈다. collector를 세운 뒤 dev overlay 환경 변수(MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED)로 켠다.
        # 꺼 두어도 trace ID는 만들어지고 전파된다
        enabled: false
  opentelemetry:
    resource-attributes:
      "[service.name]": authentication-api
      "[service.version]": ${APP_VERSION:unknown}
  otlp:
    metrics:
      export:
        # 지표는 Prometheus가 수집한다. OTLP로 따로 보내지 않는다
        enabled: false
  logging:
    export:
      otlp:
        # 로그는 stdout → Filebeat → Logstash로 수집한다. OTLP로 따로 보내지 않는다
        enabled: false

auth:
  terms:
    enabled: ${AUTH_TERMS_ENABLED:true}
  google:
    client-id: ${AUTH_GOOGLE_CLIENT_ID:}
    client-secret: ${AUTH_GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${AUTH_GOOGLE_REDIRECT_URI:}

kafka:
  producer:
    relay:
      # outbox relay 를 돌릴지. false 면 이벤트가 outbox 에 쌓이기만 하고 Kafka 로 나가지 않는다.
      # 급히 멈춰야 할 때 Deployment 에 KAFKA_PRODUCER_RELAY_ENABLED=false 를 넣으면 코드 변경 없이 끌 수 있다.
      enabled: ${KAFKA_PRODUCER_RELAY_ENABLED:true}
