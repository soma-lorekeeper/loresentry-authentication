plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.2'
}

group = 'com.loresentry'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

def mapstructVersion = '1.6.3'

configurations {
	// 이미지에 넣을 EDOT Java agent jar. 앱 classpath와 따로 두고, jar 하나만 받는다(의존성을 따라가지 않는다)
	otelAgent {
		transitive = false
	}
}

dependencies {
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	// span을 만들고 잇는 일은 EDOT Java agent가 한다(LOG_SCHEMA.md 7절). 앱은 로깅 팩토리(adapter.out.logging)가 지금 span을
	// 읽고 우리 span(외부 호출 감싸기, 작업, outbox 행)을 열 때 쓰는 OpenTelemetry API만 둔다. 실행 중에는 agent가 이 API를 자기 SDK에 잇는다.
	// 버전은 Spring Boot가 관리한다
	implementation 'io.opentelemetry:opentelemetry-api'
	// 가상 스레드 실행기(Google, Redis)가 AppLogger와 OpenTelemetry 문맥을 새 스레드로 옮길 때 쓴다(AppLoggerAccessor)
	implementation 'io.micrometer:context-propagation'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.springframework.security:spring-security-oauth2-client'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.testcontainers:testcontainers-kafka'
	testImplementation 'com.tngtech.archunit:archunit:1.5.0'
	testImplementation 'org.testcontainers:testcontainers'
	testImplementation 'io.lettuce:lettuce-core'
	// 테스트에는 agent가 없다. 로깅 팩토리가 연 span과 지금 span 규칙은 OpenTelemetry SDK의 시험용 tracer로 확인한다
	testImplementation 'io.opentelemetry:opentelemetry-sdk'
	testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// 이미지에 넣는 EDOT Java agent. 앱 classpath에는 들어가지 않고 otelAgentJar가 build/otel/otel-agent.jar로 꺼낸다
	otelAgent 'co.elastic.otel:elastic-otel-javaagent:1.14.0'
}

// Dockerfile이 bootJar와 함께 부른다. 이름을 고정해 두어 Dockerfile과 시작 스크립트가 버전을 몰라도 된다
tasks.register('otelAgentJar', Copy) {
	from configurations.otelAgent
	into layout.buildDirectory.dir('otel')
	rename { 'otel-agent.jar' }
}

tasks.named('test') {
	useJUnitPlatform()
	inputs.property('redisImage', providers.environmentVariable('AUTH_TEST_REDIS_IMAGE').orElse('redis:7.4-alpine'))
}

spotless {
	java {
		target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
		googleJavaFormat('1.36.1').aosp()
		trimTrailingWhitespace()
		endWithNewline()
	}
}
